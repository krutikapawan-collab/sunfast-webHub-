<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator | SunFast AI Tools</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

</head>

<body>

<header>
<h1>SunFast AI Tools</h1>
<p>Free QR Code Generator</p>
</header>

<div class="container">

<h2>QR Code Generator</h2>

<input
type="text"
id="qrText"
placeholder="Enter text or URL"
style="width:100%;padding:12px;font-size:16px;border:2px solid #ddd;border-radius:8px;"
>

<br><br>

<button onclick="generateQR()">
Generate QR Code
</button>

<button onclick="downloadQR()">
Download QR
</button>

<br><br>

<div id="qrcode" style="display:flex;justify-content:center;"></div>

</div>

<footer>
<p>© 2026 SunFast AI Tools</p>
</footer>

<script>

let qr;

function generateQR(){

const text=document.getElementById("qrText").value;

document.getElementById("qrcode").innerHTML="";

qr=new QRCode(document.getElementById("qrcode"),{
text:text,
width:220,
height:220
});

}

function downloadQR(){

const img=document.querySelector("#qrcode img");

if(!img){
alert("Generate QR First");
return;
}

const a=document.createElement("a");
a.href=img.src;
a.download="qrcode.png";
a.click();

}

</script>

</body>
</html>
