<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SunFast AI Tools - Word Counter</title>

  <meta name="description" content="Free Word Counter Tool with Character Count, Reading Time, Sentence Counter and Paragraph Counter.">
  <meta name="keywords" content="Word Counter, Character Counter, AI Tools, Free Tools">
  <meta name="author" content="SunFast AI Tools">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Header -->
<header>
    <div class="logo">
        <h1>SunFast AI Tools</h1>
        <p>Free Online Smart Tools</p>
    </div>
</header>

<!-- Top Ad -->
<div class="ad-box">
    <!-- Paste Google AdSense / Adsterra Code Here -->
    Advertisement
</div>

<!-- Main Container -->
<div class="container">

<h2>Word Counter Tool</h2>

<textarea
id="textInput"
placeholder="Type or Paste your text here..."></textarea>

<div class="buttons">

<button id="copyBtn">
📋 Copy
</button>

<button id="clearBtn">
🗑 Clear
</button>

<button id="downloadBtn">
⬇ Download TXT
</button>

</div>

<div class="stats">

<div class="card">
<h3 id="wordCount">0</h3>
<p>Words</p>
</div>

<div class="card">
<h3 id="charCount">0</h3>
<p>Characters</p>
</div>

<div class="card">
<h3 id="charNoSpace">0</h3>
<p>No Spaces</p>
</div>

<div class="card">
<h3 id="sentenceCount">0</h3>
<p>Sentences</p>
</div>

<div class="card">
<h3 id="paragraphCount">0</h3>
<p>Paragraphs</p>
</div>

<div class="card">
<h3 id="readingTime">0 Min</h3>
<p>Reading Time</p>
</div>

</div>

</div>

<!-- Bottom Ad -->
<div class="ad-box">
    <!-- Paste Google AdSense / Adsterra Code Here -->
    Advertisement
</div>

<footer>

<p>
© 2026 SunFast AI Tools | All Rights Reserved
</p>

</footer>

<script src="script.js"></script>

</body>
</html>
