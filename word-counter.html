<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Counter | SunFast AI Tools</title>

<meta name="description" content="Free Word Counter Tool">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<h1>SunFast AI Tools</h1>
<p>Free Word Counter Tool</p>
</header>

<div class="container">

<h2>Word Counter</h2>

<textarea id="textInput" placeholder="Type or Paste your text here..."></textarea>

<div class="buttons">
<button id="copyBtn">📋 Copy</button>
<button id="clearBtn">🗑 Clear</button>
<button id="downloadBtn">⬇ Download</button>
</div>

<div class="stats">

<div class="card">
<h3 id="wordCount">0</h3>
<p>Words</p>
</div>

<div class="card">
<h3 id="charCount">0</h3>
<p>Characters</p>
</div>

<div class="card">
<h3 id="charNoSpace">0</h3>
<p>No Spaces</p>
</div>

<div class="card">
<h3 id="sentenceCount">0</h3>
<p>Sentences</p>
</div>

<div class="card">
<h3 id="paragraphCount">0</h3>
<p>Paragraphs</p>
</div>

<div class="card">
<h3 id="readingTime">0 Min</h3>
<p>Reading Time</p>
</div>

</div>

</div>

<footer>
<p>© 2026 SunFast AI Tools</p>
</footer>

<script src="script.js"></script>

</body>
</html>
