<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator | SunFast AI Tools</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>SunFast AI Tools</h1>
<p>Free Password Generator</p>
</header>

<div class="container">

<h2>Password Generator</h2>

<input
type="number"
id="length"
min="6"
max="64"
value="12"
placeholder="Password Length"
style="width:100%;padding:12px;font-size:16px;border:2px solid #ddd;border-radius:8px;"
>

<br><br>

<label><input type="checkbox" id="uppercase" checked> Uppercase</label><br>
<label><input type="checkbox" id="lowercase" checked> Lowercase</label><br>
<label><input type="checkbox" id="numbers" checked> Numbers</label><br>
<label><input type="checkbox" id="symbols" checked> Symbols</label>

<br><br>

<button onclick="generatePassword()">Generate Password</button>

<button onclick="copyPassword()">Copy</button>

<br><br>

<input
type="text"
id="password"
readonly
style="width:100%;padding:12px;font-size:18px;text-align:center;border:2px solid #0d6efd;border-radius:8px;"
>

</div>

<footer>
<p>© 2026 SunFast AI Tools</p>
</footer>

<script src="script.js"></script>

</body>
</html>
